<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMK Pasundan Caringin</title>
<meta name="description" content="Aplikasi sekolah multifungsi SMK Pasundan Caringin: jadwal pelajaran, absen, arsip, jam sekolah, dan pengumuman.">
<meta name="theme-color" content="#0d4f38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <div id="login-screen" class="hidden">
    <div class="login-wrap">
      <div class="login-logo">
        <div class="logo-badge">SP</div>
      </div>
      <h1 class="login-title">SMK Pasundan <span>Caringin</span></h1>
      <p class="login-sub">Aplikasi Sekolah Multifungsi</p>

      <form id="login-form" class="login-card card">
        <div class="field">
          <label for="login-username">Username / NIS</label>
          <input id="login-username" class="input" type="text" placeholder="cth: admin" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" class="input" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>

      <div class="login-hint card">
        <div class="hint-title">Akun demo</div>
        <div class="hint-row"><span class="chip chip-admin">Admin</span><code>admin / admin123</code></div>
        <div class="hint-row"><span class="chip chip-guru">Guru</span><code>guru / guru123</code></div>
        <div class="hint-row"><span class="chip chip-siswa">Siswa</span><code>24001 / siswa123</code></div>
      </div>

      <p class="login-footer">© 2026 SMK Pasundan Caringin<br>Jl. Samundra, Kabupaten Garut<br>Owner: Arman</p>
    </div>
  </div>

  <div id="main" class="hidden">
    <header id="topbar">
      <button id="btn-back" class="icon-btn hidden" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-badge">SP</div>
          <div>
            <div class="brand-name" id="topbar-title">Beranda</div>
            <div class="brand-sub">SMK Pasundan Caringin</div>
          </div>
        </div>
        <div class="topbar-clock" id="topbar-clock" title="Jam sekarang">--:--</div>
      </div>
    </header>

    <main id="content"></main>

    <nav id="bottom-nav">
      <button class="nav-item" data-page="beranda" aria-label="Beranda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Beranda</span>
      </button>
      <button class="nav-item" data-page="jadwal" aria-label="Jadwal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Jadwal</span>
      </button>
      <button class="nav-item" data-page="absen" aria-label="Absen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Absen</span>
      </button>
      <button class="nav-item" data-page="arsip" aria-label="Arsip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <span>Arsip</span>
      </button>
      <button class="nav-item" data-page="profil" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profil</span>
      </button>
    </nav>
  </div>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
